<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Card</title>
</head>
<body>

    <div style="border: 1px solid gray; width: 300px; padding: 15px;">

        <img src="https://placehold.co/250x180?text=Headphones"
             alt="Wireless Headphones"
             width="250">

        <h2 style="background-color: lightblue; font-size: 24px;">
            Wireless Headphones
        </h2>

        <p>High-quality wireless headphones with clear sound.</p>

        <p><strong>Price: ₹999</strong></p>

        <button>Add to Cart</button>

    </div>

</body>
</html>
